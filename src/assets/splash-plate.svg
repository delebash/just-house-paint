<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- The boot plate (index.html) and the warm-start splash (app.scss .splash__plate): the app's mark
       and name in tokens.css's colours; dark follows the colour scheme it is shown in. -->
  <style>
    .bg { fill: #fafaf7; }
    .mark { fill: #3a7d63; }
    .house { fill: #ffffff; }
    .door { fill: #3a7d63; }
    .stroke { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: round; opacity: 0.85; }
    .name { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1c1a; }
      .mark { fill: #58a889; }
      .house { fill: #1a1c1a; }
      .door { fill: #58a889; }
      .stroke { stroke: #1a1c1a; }
      .name { fill: #f0eee8; }
    }
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <rect class="mark" x="736" y="372" width="128" height="128" rx="30"/>
  <path class="house" d="M800 398 L840 432 L833 432 L833 474 L767 474 L767 432 L760 432 Z" stroke-linejoin="round"/>
  <rect class="door" x="792" y="448" width="16" height="26" rx="2"/>
  <path class="stroke" d="M762 486 C 780 480, 806 492, 838 484"/>
  <text class="name" x="800" y="568" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="40" font-weight="600">Just House Paint</text>
</svg>
